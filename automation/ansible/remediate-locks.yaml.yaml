# File: automation/ansible/remediate-locks.yaml
---
- name: SRE Auto-Remediation - PostgreSQL Thundering Herd
  hosts: localhost
  gather_facts: false
  vars:
    namespace: "db-lab"
    pod_name: "postgres-0"
    db_user: "lab_user"
    db_name: "lab_db"

  tasks:
    - name: 🚨 Step 1 - Execute Surgical Termination of Blocking PID
      # This SQL query finds the active query holding a lock for >15s and kills it
      ansible.builtin.shell: |
        kubectl exec -n {{ namespace }} {{ pod_name }} -- psql -U {{ db_user }} -d {{ db_name }} -t -c "
        SELECT pg_terminate_backend(pid)
        FROM pg_stat_activity
        WHERE state = 'active' 
          AND wait_event_type IS NULL 
          AND state_change < current_timestamp - interval '15 seconds'
          AND pid IN (SELECT unnest(pg_blocking_pids(pid)) FROM pg_stat_activity WHERE wait_event_type = 'Lock');
        "
      register: kill_output
      ignore_errors: true

    - name: 📝 Step 2 - Verify Remediation Output
      ansible.builtin.debug:
        msg: >
          Remediation complete. 
          Status: {% if kill_output.stdout | trim == 't' %}SUCCESS (Blocking Query Terminated){% else %}NO BLOCKING QUERIES FOUND{% endif %}
      
    - name: 🛡️ Step 3 - Apply Tier 1 Defense (Configure Lock Timeouts)
      # Hardcodes a 2-second lock timeout to prevent this from happening again today
      ansible.builtin.shell: |
        kubectl exec -n {{ namespace }} {{ pod_name }} -- psql -U {{ db_user }} -d {{ db_name }} -c "
        ALTER SYSTEM SET lock_timeout = '2000';
        ALTER SYSTEM SET statement_timeout = '5000';
        SELECT pg_reload_conf();
        "
      register: config_output

    - name: 📢 Step 4 - Log Defensive Configuration Action
      ansible.builtin.debug:
        msg: "Fail-Fast timeouts applied to postgresql.conf to protect the cluster."